name: review-reviewers
# Outcome-based analysis of bot behavior across consumer repos. Each matrix entry
# is a repo to analyze. The job checks out the tend repo (for creating
# improvement PRs/issues). TEND_BOT_TOKEN is sufficient for reading CI data from
# public consumer repos.
#
# The matrix is the consumers nobody here maintains, because those are the
# repos whose runs nobody here reads. On our own, tend's work arrives in PRs
# and issues we look at anyway, so a bad week is visible without a sweep. Add
# a repo when a new adopter is one we don't maintain.
#
# It used to sweep every consumer, hourly. That was the fleet's highest
# per-run cost and twice hit a quota ceiling that took the user-facing
# workflows down with it; two legs a day is a fraction of it.
#
# Each consumer's own daily `tend-review-runs` reviews that repo's runs from
# the inside and routes bundled-skill defects upstream; this is the same
# reading from outside, and it still works when a repo has switched tend off.
on:
  schedule:
    # Off-peak (outside weekday 8am–2pm ET), and after the consumers' own
    # nightly and review-runs defaults, so a tick sees the whole night.
    - cron: "41 9 * * *"
  workflow_dispatch:

jobs:
  # Create the monthly tracking issue before the matrix runs, so all matrix
  # legs find an existing issue instead of racing to create one. Without this,
  # the first cron tick of each new month produced N-1 duplicate tracking
  # issues (one per matrix leg that lost the find-or-create race).
  #
  # This is an optimisation, not a precondition: the skill still carries its own
  # find-or-create fallback, so the matrix runs even when this job doesn't
  # complete (see `if:` on the matrix job below).
  init-tracking:
    # A cron fires in a fork that has enabled Actions, where neither the
    # environment nor the pause variable is ours; both guards no-op it there.
    if: github.repository_owner == 'max-sixty' && vars.TEND_ENABLED != 'false'
    runs-on: ubuntu-24.04
    environment:
      name: tend
      deployment: false
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ secrets.TEND_BOT_TOKEN }}
        run: |
          MONTH=$(date -u +%Y-%m)
          LABEL="review-reviewers-tracking"
          NUM=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --label "$LABEL" \
            --json number,title \
            --jq "[.[] | select(.title | contains(\"$MONTH\"))] | sort_by(.number) | .[0].number // empty")
          if [ -n "$NUM" ]; then
            echo "Tracking issue for $MONTH exists: #$NUM"
            exit 0
          fi
          cat > /tmp/body.md <<'EOF'
          Monthly tracking issue for `review-reviewers`. Per-target evidence lives in secret gists owned by the bot. A comment below is posted when each target's gist is first created.

          **Do not close manually** — a new issue is created each month.
          EOF
          gh issue create -R "$GITHUB_REPOSITORY" \
            --title "$LABEL: $MONTH" --label "$LABEL" -F /tmp/body.md

  review-reviewers:
    needs: init-tracking
    # Run even when init-tracking failed or never got a runner — losing the
    # race guard costs up to N-1 duplicate tracking issues on the first tick of
    # a month, while gating on it costs the whole analysis window for every
    # target repo. Not `always()`: a user cancelling the run should stop here.
    # `!cancelled()` also runs past a *skipped* `init-tracking`, so the guards
    # above are repeated here rather than inherited through `needs`.
    if: ${{ !cancelled() && github.repository_owner == 'max-sixty' && vars.TEND_ENABLED != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        # TODO: consider deriving this from data/consumers.json — everything
        # there we don't maintain. That needs the ownership recorded in a file
        # the Worker serves publicly, and a job to emit the matrix, since
        # Actions cannot read a file into one. Two names stay cheap until
        # adopters we don't maintain outnumber the ones we do.
        repo:
          - diffplug/dormouse
          - jakobtfaber/Faber2026
    runs-on: ubuntu-24.04
    environment:
      name: tend
      deployment: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.TEND_BOT_TOKEN }}

      - uses: max-sixty/tend/codex@0.3.2
        with:
          github_token: ${{ secrets.TEND_BOT_TOKEN }}
          codex_auth_json: ${{ secrets.CODEX_AUTH_JSON }}
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          bot_name: tend-agent
          model: gpt-6-sol
          prompt: |
            $review-reviewers ${{ matrix.repo }}
