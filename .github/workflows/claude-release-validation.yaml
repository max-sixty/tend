name: Claude release validation

on:
  workflow_dispatch:

jobs:
  validate:
    if: github.repository == 'max-sixty/tend' && github.ref == 'refs/heads/main' && vars.TEND_ENABLED != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: tend
      deployment: false
    permissions:
      contents: read
      actions: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: max-sixty/tend/setup-runtime@0.3.21

      - uses: max-sixty/tend/claude@0.3.21
        with:
          github_token: ${{ secrets.TEND_BOT_TOKEN }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          merge: restricted
          checkout_mode: base
          base_branch: ${{ github.event.repository.default_branch }}
          timeout_seconds: "1200"
          show_full_output: "true"
          prompt: |
            /tend-ci-runner:run-tend

            Validate Tend 0.3.21's CLI and workflow migration on this
            main revision. This is a read-only release check: do not edit files,
            push commits, dispatch workflows, or post comments, reviews, issues,
            or PRs. Report your findings in your final response.

            Run `tend --help`, `tend runtime --help`, and help for the
            triage-batch and workflow-update runtime commands. Use the read-only
            `tend runtime workflow-update version` helper to inspect the deployed
            workflow version. Inspect the action manifests and generated
            workflows to verify setup-runtime precedes each job's first Tend
            operation, refs consistently use 0.3.21, and retired action inputs
            and config fields have been removed from the relevant callers.

            Run `tend init --dry-run` using the installed release. Compare its
            rendered workflow content with the committed generated workflows,
            distinguishing material differences from formatting. Do not run
            verify-generation or add an install-test workflow. Confirm the
            triage dispatcher accepts the JSON-array issues input and the
            rendered matrix has the configured parallelism bound.

            Conclude whether the deployed CLI, setup prerequisite, and config
            migration are consistent. Include concrete command results and
            source locations for any defect, and identify checks you could not
            complete. Do not fix findings during this run.
