name: Release to PyPI

on:
  push:
    tags: ["[0-9]*"]

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.repository == 'max-sixty/tend'
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require successful Codex smoke on the release commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I scripts/check_release_smoke.py

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      # Built from the repo root: `uv build` in a workspace member still writes
      # to the workspace root's dist/, so `working-directory: generator` would
      # leave every later step globbing a directory that was never created.
      # `--package tend` names the member — a bare root build tries to build
      # the virtual `tend-dev` through setuptools and fails.
      - name: Build package
        run: uv build --package tend

      - name: Check artifacts
        run: python3 -I scripts/check_release_artifacts.py

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github-release:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create GitHub Release from CHANGELOG section
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -I scripts/publish_release.py
