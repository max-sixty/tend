name: Release to PyPI

on:
  push:
    tags: ["[0-9]*"]

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.repository == 'max-sixty/tend'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      # Built from the repo root: `uv build` in a workspace member still writes
      # to the workspace root's dist/, so `working-directory: generator` would
      # leave every later step globbing a directory that was never created.
      # `--package tend` names the member — a bare root build tries to build
      # the virtual `tend-dev` through setuptools and fails.
      - name: Build package
        run: uv build --package tend

      - name: Check artifacts
        run: |
          uv tool run --from twine twine check dist/*
          if [ -f dist/tend-0.0.0.tar.gz ]; then
            echo "Invalid version number"
            exit 1
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github-release:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create GitHub Release from CHANGELOG section
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Publish the tag's CHANGELOG section verbatim as the release notes.
          # Exact header match so 0.1.1 doesn't capture 0.1.10's section.
          awk -v ver="$GITHUB_REF_NAME" '
            $0 == "## " ver {flag=1; next}
            flag && /^## / {exit}
            flag {print}
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "::error::No CHANGELOG.md section for $GITHUB_REF_NAME in the tagged commit. The tag is immutable, so re-running cannot fix this — add the section on main and run 'gh release create $GITHUB_REF_NAME' manually with the extracted notes."
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
