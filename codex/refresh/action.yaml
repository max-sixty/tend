name: Refresh Tend Codex subscription auth
description: Rotate the full auth bundle and publish its access-only consumer view.

inputs:
  consumer_auth_configured:
    required: false
    default: "false"
    description: Whether the tend environment holds access-only subscription auth
  codex_refresh_auth_json:
    required: false
    default: ""
    description: Full refreshable ChatGPT auth bundle held only by this workflow
  refresh_pat:
    required: false
    default: ""
    description: GitHub PAT allowed to update secrets in the refresh and tend environments
  codex_version:
    default: "0.160.0"
    description: Pinned @openai/codex npm version that performs the refresh

runs:
  using: composite
  steps:
    - name: Install runtime uv
      shell: bash
      run: bash "${{ github.action_path }}/../../shared/steps/install-uv.sh"
      env:
        UV_INSTALL_DIR: ${{ runner.temp }}/tend-uv

    - name: Install Tend runtime package
      shell: bash
      run: bash "${{ github.action_path }}/../../shared/steps/install-runtime.sh"
      env:
        ACTION_PATH: ${{ github.action_path }}/../..
        UV_INSTALL_DIR: ${{ runner.temp }}/tend-uv

    - name: Stage refreshable auth
      id: auth
      shell: bash
      env:
        CODEX_REFRESH_AUTH_JSON: ${{ inputs.codex_refresh_auth_json }}
        CODEX_REFRESH_PAT: ${{ inputs.refresh_pat }}
        CODEX_CONSUMER_AUTH_CONFIGURED: ${{ inputs.consumer_auth_configured }}
      run: |
        "$TEND_RUNTIME_PYTHON" -I -m tend runtime codex auth stage-refresh "$RUNNER_TEMP/tend-codex-refresh/auth.json"

    - name: Install Codex CLI
      if: steps.auth.outputs.configured == 'true'
      shell: bash
      env:
        CODEX_VERSION: ${{ inputs.codex_version }}
      run: |
        npm install -g "@openai/codex@$CODEX_VERSION"
        codex --version

    - name: Run Codex refresh
      id: codex
      if: steps.auth.outputs.configured == 'true'
      continue-on-error: true
      shell: bash
      env:
        CODEX_HOME: ${{ runner.temp }}/tend-codex-refresh
      run: codex exec --json --skip-git-repo-check --config 'cli_auth_credentials_store="file"' "Reply with the single word OK without using tools." >/dev/null

    - name: Publish refreshed auth
      if: always() && steps.auth.outputs.configured == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.refresh_pat }}
        CODEX_OUTCOME: ${{ steps.codex.outcome }}
      run: |
        "$TEND_RUNTIME_PYTHON" -I -m tend runtime codex auth publish-refresh "$RUNNER_TEMP/tend-codex-refresh/auth.json"
