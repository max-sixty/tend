repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
  # The hook already selects Python by type; the previous `^generator/` filter
  # only meant that each new Python directory arrived unlinted and stayed that
  # way until someone noticed.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.17
    hooks:
      # One lockfile at the workspace root covers the generator member too.
      - id: uv-lock
        files: ^(generator/)?(pyproject\.toml|uv\.lock)$
  - repo: https://github.com/adhtruong/mirrors-typos
    rev: v1.50.2
    hooks:
      - id: typos
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      # The concurrency.queue false positive is suppressed in
      # .github/actionlint.yaml, which `tend init` writes and every actionlint
      # caller reads — hook args would cover this one invocation only.
      - id: actionlint
      # Snapshot tests keep these full rendered workflows current. Linting the
      # artifacts exercises actionlint's own ShellCheck preprocessing and
      # default severity before the generator is released.
      - id: actionlint
        name: Lint generated workflow snapshots
        args:
          - -ignore
          - 'unexpected key "queue" for "concurrency" section'
        types: [file]
        files: ^generator/tests/_regtest_outputs/test_generate\..*\.out$
  # Step bodies in standalone scripts (shared/steps/, proxy/,
  # generator/src/tend/templates/, .config/codex-cloud/) are invisible to
  # actionlint's built-in shellcheck, so run shellcheck directly at warning
  # severity. The inline `run:` bodies that remain in claude/ and codex/ are
  # covered by test_inline_run_bodies_pass_shellcheck.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1
    hooks:
      - id: shellcheck
        args: ["-S", "warning"]
        files: ^(shared/steps/.*\.sh|generator/src/tend/templates/.*\.sh|proxy/.*\.sh|plugins/.*\.sh|\.config/codex-cloud/environment\.sh)$
  - repo: local
    hooks:
      # The Claude Code slash-command preprocessor treats a backticked token
      # beginning with an exclamation mark as shell command substitution. Any
      # skill file loaded by /review (or another slash command) that
      # contains this sequence crashes the session before any assistant turn
      # runs. Regressed twice already: #217 introduced, #234 fixed, #226
      # reintroduced, #243 fixed again. This guard rejects a third regression
      # at commit time. The check uses chr(33)+chr(96) so the script itself
      # is safe from the pattern it is searching for.
      - id: no-preprocessor-poison-in-skills
        name: forbid bang-backtick in skill files
        language: system
        entry: python3
        args:
          - -c
          - |
            import pathlib, sys
            poison = chr(33) + chr(96)
            roots = (pathlib.Path("plugins"), pathlib.Path(".claude/skills"))
            hits = [
                (str(p), i, line)
                for root in roots
                for p in root.rglob("*.md")
                for i, line in enumerate(p.read_text().splitlines(), start=1)
                if poison in line
            ]
            for p, i, line in hits:
                print(f"{p}:{i}: {line}")
            if hits:
                print(
                    "\nERROR: bang-backtick sequence in a skill file. "
                    "The Claude Code slash-command preprocessor treats this "
                    "as command substitution and crashes the session. "
                    "See max-sixty/tend#234, #243, #244."
                )
                sys.exit(1)
        pass_filenames: false

      # install-tend ships from the marketplace into other repos, so its
      # skill cannot reference repo-internal paths like docs/. Files an
      # installing agent needs are mirrored into the skill's references/
      # dir, which ships inside the plugin subtree. This hook keeps the
      # mirror byte-identical to its canonical source and fails the commit
      # if it drifted (re-stage the synced file).
      - id: sync-install-tend-references
        name: sync install-tend references/ from canonical sources
        language: system
        entry: python3
        args:
          - -c
          - |
            import pathlib, sys

            refs = pathlib.Path(
                "plugins/install-tend/skills/install-tend/references"
            )
            # canonical source -> shipped mirror
            mirrors = {
                pathlib.Path("docs/tend.example.yaml"): refs / "tend.example.yaml",
            }
            stale = []
            for src, dst in mirrors.items():
                if not src.exists():
                    print(
                        f"ERROR: canonical source {src} is missing. A mirror "
                        "in install-tend references/ points at it; update the "
                        "sync-install-tend-references hook if the path moved."
                    )
                    sys.exit(1)
                want = src.read_text()
                if not dst.exists() or dst.read_text() != want:
                    dst.write_text(want)
                    stale.append(f"{dst} (synced from {src})")
            if stale:
                print("Updated install-tend mirrors; re-stage them:")
                for s in stale:
                    print(f"  {s}")
                sys.exit(1)
        pass_filenames: false
