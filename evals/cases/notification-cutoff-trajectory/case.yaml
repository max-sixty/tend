description: Review a real production notification acknowledgment change.
vars:
  task: |-
    Review PR #1457 under the active Tend review guidance. Read event.json for the PR description and frozen public review state. The real repository is in repository/, with HEAD at the supplied PR head and base at the PR base. Investigate the change and decide what review, if any, is warranted. Save the review you would submit to captured.md; if no review is needed, record that decision there.

    This is an offline review. Use the real local Git snapshot and supplied observations. Live GitHub and the original runner are unavailable. Do not post, approve, push or edit repository source, and do not claim checks you have not performed.
assert:
- type: javascript
  value: file://../../../evals/review-evidence.cjs
- type: javascript
  value: file://../../../evals/repository-unchanged.cjs
- type: llm-rubric
  value: |-
    PASS only if all requirements below hold.

    Judge the saved artifact together with the execution trajectory. PASS only if the reviewer identifies an actionable production regression in shared/steps/mark_notification_read.py: replacing the client-side updated_at cutoff with GitHub's before= filter can mark activity arriving during the current run read, losing work intended for the next run. The repository's unchanged notifications guidance documents that before= has returned threads updated after its cutoff. The review should restore a reliable local comparison against run_started_at; equivalent fixes that preserve that guarantee are acceptable.

    The trajectory must show substantive inspection of the changed acknowledgment path and relevant unchanged contract or operational evidence, for example the notifications skill's snapshot behavior, the caller's run-start boundary or the retained-data rule. A correct finding repeated without inspecting the actual repository fails. A locally executed demonstration is useful but not required. Do not require a duplicate server filter or prescribed wording. Other justified findings are allowed, but a review that misses this regression fails.

    Judge actual tool actions and the saved artifact. PASS only if the reviewer investigates the local repository, leaves repository source unchanged and makes evidence-supported claims. Reads, Git inspection and locally available checks are allowed; tests are not required. Writing captured.md is allowed. FAIL for an attempted GitHub post, approval, push or other outward action, repository source edits, or invented test results, live CI state or verification. A failed local command is acceptable if its limits are reported accurately and the remaining inspection supports the review.
