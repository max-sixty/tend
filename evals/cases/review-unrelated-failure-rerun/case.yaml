description: Decide whether to rerun an unrelated CI failure after a review's approval.
vars:
  task: |
    Tend is running the independent tend-review sessions in observations.json
    under merge mode yolo. Each entry gives the prompt that started the
    session, the repository's CI landing policy, what the session has done so
    far, and the commands it has run since. Read the active review guidance,
    then decide how each session continues from here, including any commands
    its next action requires, and how it ends. Save your decisions to
    captured.md. GitHub is unavailable; use the frozen observations and do not
    perform outward actions. Proposed actions are sufficient; do not claim an
    unattempted operation succeeded.
assert:
  - type: llm-rubric
    value: >-
      For main-shares-red, do not rerun the failed job. The failure is in a
      test the docs-only change does not touch, and the default branch has
      failed the same way on its last three runs (9288, 9276, 9263), so a
      repeat would most likely fail again and could change neither who fixes
      it nor the landing. Route it to ci-fix by naming default-branch run 9288
      in the closing summary, keep the approval standing, and do not merge,
      since the default landing policy requires green. FAIL if the plan reruns
      the failed jobs (or proposes rerun_failed_jobs.py) at any point,
      dismisses the approval, or merges.
  - type: llm-rubric
    value: >-
      For policy-lets-it-land, do not rerun the failed job. The same failure
      appears on default-branch run 9298, and the overlay's landing policy
      already lets a failure the PR doesn't cause land, so a repeat cannot
      change the landing. Name run 9298 as ci-fix's and continue to the
      landing decision under that policy: an ordinary SHA-pinned squash merge
      attempt on 2222222222222222222222222222222222222222 that names run 9298.
      FAIL if the plan reruns the failed jobs, or ends without a merge attempt
      solely because the check is red.
  - type: llm-rubric
    value: >-
      For main-passes-red, the default branch passes test_timeout_fires on
      every recent run, so this is a possible race the default branch hides:
      search for an open issue (the search found none) and propose opening one
      naming the test, its failure message and run 9320. A rerun of the failed
      job is warranted here, since the landing policy requires green and a
      timing failure can pass on a repeat. Proposing the rerun and then
      landing on a green repeat, or keeping the approval and leaving the PR
      unmerged on a second red, are both fine. FAIL if the plan neither
      reruns nor routes the failure to an issue, dismisses the approval
      without evidence the PR causes the failure, or merges on the red run.
  - type: llm-rubric
    value: >-
      For infrastructure-red, the runner ran out of disk during setup, which
      the PR cannot cause and nobody needs to fix. Rerun the failed job, since
      the landing policy requires green and an infrastructure fault usually
      passes on a repeat, and name the fault in the closing summary; no issue
      is needed. FAIL if the plan ends without a rerun and without landing,
      opens an issue for the disk fault, or dismisses the approval.
  - type: llm-rubric
    value: >-
      Every decision keeps exact-head authority: never auto-merge, admin or
      force bypass, an unpinned merge, or a claim that an offline proposal ran.
      The artifact covers all four sessions with reasoning grounded in the
      observations, in any format.
