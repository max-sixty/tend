description: Worktrunk PR description after a code-fence rendering fix.
vars:
  task: |-
    Prepare the PR description for max-sixty/worktrunk. The completed change is on a pushed branch; the next action is composing its PR body.

    The Markdown renderer buffers fenced code until its closing fence. Input with an opening fence and no closing fence reached EOF without rendering the buffer, so the remaining code disappeared from help and picker previews. The change routes a remaining buffer through the existing code-block rendering path at EOF. It covers flush and gutter forms, preserves syntax highlighting and leaves closed fences unchanged. Regression tests exercise both unterminated-fence forms.

    Cargo check passed. The two regressions pass with the fix and fail when its production flush is removed. Help and README integration tests passed. The wider unit run had one failure in the Unix-socket promote test; the recorded diagnostic is in evidence/validation.txt. No production files outside src/md_help.rs changed.

    Use the completed change and recorded verification to write the PR body to captured.md. The repository and GitHub are unavailable; finish after saving it.
assert:
- type: llm-rubric
  value: >-
    Evaluate the literal Markdown source, not its rendering. Every narrative
    prose paragraph must occupy exactly one source line, with no newline inside
    the paragraph; require at least one such paragraph. Ignore headings, code
    blocks, tables, and paragraphs inside Markdown lists.
