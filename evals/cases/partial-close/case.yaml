schema_version: "1.1"
name: partial-close
description: Resume Leaf's partial issue fix before its erroneous closing trailer.
tags: [production, pr-description]
runs: 3
context:
  history_file: history.jsonl
execution:
  model: claude-opus-5
  max_turns: 12
  timeout_seconds: 600
  allowed_tools: [Read, Write, Skill]
  prompt: |
    Continue from the recorded investigation and completed fix. Compose the PR description using that evidence and the applicable Tend guidance, and save it to captured.md using Write.

    This is an offline decision replay: the repository work is already done; shell and GitHub are unavailable. Do not claim new verification, do not publish, and do not edit source. The next artifact is the PR body only.
graders:
  - name: body-present
    type: regex
    target: {source: file, path: captured.md}
    pattern: '\S'
  - name: keeps-partial-issue-open
    type: regex
    target: {source: file, path: captured.md}
    pattern: '\b(?:close[sd]?|fix(?:es|ed)?|resolve[sd]?):?\s+(?:max-sixty/leaf)?#868\b'
    flags: i
    match: not_contains
