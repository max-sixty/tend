description: Resume Leaf's partial issue fix before its erroneous closing trailer.
vars:
  task: |
    Continue from the recorded investigation and completed fix. Compose the PR description using that evidence and the applicable Tend guidance. Write the PR description to captured.md with the Write tool rather than posting it.

    This is an offline decision replay: the repository work is already done; shell and GitHub are unavailable. Do not claim new verification, do not publish, and do not edit source. The next artifact is the PR body only.
assert:
  - type: regex
    value: '\S'
  - type: javascript
    value: |
      const closesIssue = /\b(?:close[sd]?|fix(?:es|ed)?|resolve[sd]?):?\s+(?:max-sixty\/leaf)?#868\b/i.test(output);
      return {pass: !closesIssue, score: closesIssue ? 0 : 1, reason: closesIssue ? 'Partial fix closes #868' : 'Partial issue stays open'};
