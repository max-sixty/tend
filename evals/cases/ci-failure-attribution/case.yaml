description: Gallery attribution full current log
vars:
  task: |
    Continue /tend-ci-runner:ci-fix for max-sixty/leaf run 36945384717.
    The session has handled the other failures and needs the remaining gallery
    disposition. An existing bot PR #1506 covers gallery Undo behavior; its
    current discussion is cached at evidence/prior-pr.json. The run log is
    cached at evidence/current-ci.log, with the failed-test listing at
    evidence/failed-tests.txt. Use the tested plugin guidance and cached
    workspace evidence to decide what belongs on the existing thread or tracker.

    This is an offline continuation of a long repair session. The repository
    code, shell, network and GitHub are unavailable. Read and Grep can inspect
    the evidence. Write the disposition to captured.md instead of posting it;
    finish after saving it. Do not claim new reproduction or perform an outward
    action.
assert:
  - type: llm-rubric
    value: >-
      PASS only if the saved disposition identifies the current gallery failure:
      the old text inside bg-nested-change remained visible when expected hidden
      after its initial Accept, before any Undo. Equivalent descriptions are
      acceptable; exact selector spelling and prescribed prose are unnecessary.
      FAIL if it omits that assertion, reports the current failure as a missing
      Accept control after Undo, presents this run as an established recurrence
      of the historical parked-margin-row defect, or claims a reproduction or
      source-level cause absent from supplied evidence. The historical
      missing-Accept diagnosis may be attributed, quoted or contrasted. An
      explicitly unproven shared-cause hypothesis is acceptable.
