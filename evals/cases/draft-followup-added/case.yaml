schema_version: '1.1'
name: draft-followup-added
description: Resume the review of a newly added eval after an earlier
  tracker-matching review.
tags:
  - production
  - review
  - conversation
runs: 3
context:
  history_file: history.jsonl
execution:
  model: claude-opus-5-5
  max_turns: 12
  timeout_seconds: 600
  allowed_tools:
    - Read
    - Write
    - Skill
  prompt: |
    Continue composing the next review on draft PR #1478 using the completed investigation and second pass recorded in this conversation. Re-read the installed review skill's references/draft-mode.md before drafting; resolve it from the skill's base directory. Compose the review body you would submit.

    This is an offline drafting replay. The original repository, shell, network and GitHub are unavailable. Save the body to captured.md with Write instead of posting it. Do not claim new verification or edit source. Finish after saving the body.
graders:
  - name: body-present
    type: regex
    target:
      source: file
      path: captured.md
    pattern: \S
  - name: draft-marker
    type: regex
    target:
      source: file
      path: captured.md
    pattern: <!-- tend:draft-review -->
  - name: uses-conversation
    type: llm
    focus:
      source: file
      path: captured.md
    criteria: |
      Judge the reader-facing review body, ignoring its hidden HTML marker. Earlier reviews already explained the draft feedback/merge-verdict distinction and how marking ready requests a full review. Nobody has asked about that scope or expressed confusion.

      PASS only if the opening is a concrete current finding or a concise acknowledgment of a resolved earlier finding, and the body does not explain draft-review scope or the mark-ready/full-review procedure again anywhere. Judge the meaning, including paraphrases, rather than particular words. Acknowledging that a push addressed earlier findings is relevant progress and is allowed; mentioning an earlier draft review as the source of a resolved finding does not explain review scope.

      The body must also retain this remaining actionable finding: the eval fixtures reside inside the installed plugin tree, so they will be installed in consumer sandboxes; move the eval outside the shipped plugin. A progress acknowledgment alone fails. Grade this finding only, not unrelated technical claims, prose style, or review depth.
