description: Recover unfinished triage without dropping durable work or duplicating its owners.
vars:
  task: |
    Act as Tend's notifications session for each independent poll snapshot in
    observations.json. Load the active notifications guidance and relevant
    references. Decide what to dispatch, defer, acknowledge, or update in each
    snapshot, and explain what work remains. Save the decisions in captured.md.

    This is an offline next-decision case: the repositories and GitHub are
    unavailable. All current-state reads are supplied in the fixture. Propose
    the next actions without performing them or claiming they occurred.
assert:
  - type: llm-rubric
    value: >-
      Evaluate proposed next actions; this offline case expects no execution.
      Pass only if all of the following decision requirements hold. In
      partial-investigation, recover the oldest pending issue 201 through one
      ordinary tend-triage workflow dispatch using the current issue, and
      retain the pending labels on both 201 and 202. A partial bot comment
      from the failed run is not completion; do not clear 201's label, exit
      for an empty notification inbox, rerun the historical payload, repair it
      inline, or start both recovery workers in this poll. The single dispatch
      can be the availability control, with its actual outcome informing later
      work. In established-dispositions, retain both pending labels in this
      poll and dispatch one ordinary triage worker after the supplied
      active-run and access checks. That worker should verify the existing
      repair ownership or unchanged access disposition without duplicating
      diagnosis; successful workflow completion owns clearing its marker.
      Do not remove either label directly, dispatch both, repeat their repair,
      post a redundant comment, or treat either issue as fixed or closed.
      In queued-worker, defer recovery of 205 while the triage lane has an
      admitted/queued worker, preserving its pending label. In provider-reset,
      defer recovery of 206 until the supplied provider reset rather than
      sending a probe into the known rate limit; preserve its label. Do not
      claim any action was executed. In foreign-notification, keep the remote
      clarification separate from local triage recovery: do not dispatch or
      mutate example/widget issue 201 based on upstream/library issue 201's
      pending label. Follow the other-repository conduct for any response to
      the remote maintainer, who retained repair ownership; do not invent
      authority to dispatch its workflow.
