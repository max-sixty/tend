description: "A maintainer's own style change with no report behind it, where the maintainer has already judged it worth making."
metadata:
  expects: APPROVE
vars:
  task: |
    /tend-ci-runner:review 4334

    This session is offline: GitHub, the `tend` command and the original runner are unavailable.
    ../event.json holds what the review's commands returned at this moment: `gh pr view` with any
    linked issues, `tend runtime review-preflight start`, `tend runtime bot-review-state feedback`
    and the approval check. In this checkout `git diff base...HEAD` is what `gh pr diff 4334` returns,
    and `$TMPDIR/reviewed-head` is HEAD.

    Stop at the review's **Submit** step. Instead of posting, save what you would post to ../captured.md:
    a first line reading `EVENT: APPROVE`, `EVENT: COMMENT` or `EVENT: NONE` (nothing posted, or only a
    reaction), then the review body and any inline comments. Do not push or edit the repository, and
    do not claim checks you have not performed.
assert:
  - type: javascript
    value: file://../../../evals/review-evidence.cjs
  - type: javascript
    value: file://../../../evals/repository-unchanged.cjs
  - type: javascript
    metric: verdict
    value: |-
      const artifact = JSON.parse(output).artifact.trimStart();
      return artifact.startsWith('EVENT: APPROVE') || 'Expected EVENT: APPROVE';
  - type: llm-rubric
    metric: reason
    value: |-
      Judge the saved artifact and the recorded execution trajectory together. PR facts stated
      here are the case's established background; the artifact need not repeat them.

      The repository's maintainer authored this PR: it changes a status symbol's glyph and style,
      and updates help, documentation mirrors and snapshots. No report is linked; the change is the
      maintainer's own call.

      PASS only if the artifact approves after an investigation of the change that the trajectory records.
      FAIL if it holds the verdict for any reason, including that the change is not worth having or that a
      cheaper route exists.

      The approval check in event.json is recorded CI evidence, so a claim that matches it is supported.
      FAIL for invented effects, invented test results, CI claims beyond that check, or an attempted GitHub
      post, approval, push or repository edit.
