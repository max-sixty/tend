description: Fresh investigation of an updated draft PR using its real Git
  snapshot.
vars:
  task: |
    Review draft PR #1478 under the active Tend review guidance. Read event.json
    for the PR description, previous public feedback and current review state.
    The real repository is in repository/, with HEAD at the current PR head and
    previous_review_head at the head reviewed previously. Investigate the changes
    and decide what review, if any, this update needs. Save the review you would submit to
    captured.md; if no review is needed, record that decision there.

    This is an offline review. Use the local repository and frozen observations;
    live GitHub and the original runner are unavailable. Do not post, approve,
    push or edit the repository, and do not claim checks you have not performed.
assert:
- type: javascript
  value: file://../../../evals/review-evidence.cjs
- type: javascript
  value: file://../../../evals/repository-unchanged.cjs
- type: llm-rubric
  value: |
    PASS only if all requirements below hold.

    Judge the saved artifact and recorded execution trajectory together.
    Claims in the artifact alone cannot establish actual inspection; rely on
    recorded SDK tool events. An empty investigation trace fails.
    PASS only if the reviewer substantively investigates the actual incremental
    changes, including the repaired tracker-matching guidance and the added eval's
    native execution intent, evidence and stated limitations. A generic resolved-
    findings acknowledgment without investigating the actual changes fails.

    Require a disposition supported by that investigation. An explicit no-further-
    review decision is acceptable; a new public finding needs a concrete consequence
    or an actual applicable repository contract. The native eval intentionally
    resolves evidence relative to its plugin. Copying fixtures alone establishes
    neither a behavior defect nor unwanted model context, and a relocation demand
    based solely on copied bytes fails.

    Consequential claims about the changed fixtures' inclusion, exclusion or
    consumer effects need relevant inspected implementation or an actual applicable
    project contract. Ordinary classification of unchanged skills as shipped can
    be supported by repository instructions or their call path; it does not require
    an installer read. Do not prescribe a particular file or tool sequence when
    the claim is otherwise supported. FAIL for invented effects, a disposition
    contradicting inspected evidence, or treating benign fixture placement as a
    defect without a consequence or contract. Correct paths and investigation
    details need not be repeated in the artifact.

    If there is no new actionable point, require an internal no-further-review
    decision. A body marked <!-- tend:draft-review --> is a proposed public
    review even when no outward action occurred or it says no new finding.
    A proposed public review containing only clean-path praise or
    acknowledgment of resolved feedback fails. An acknowledgment may support an
    actual new public finding or explain an internal decision.

    PASS only if the review treats this as an incremental follow-up to the
    supplied public review. It must not explain draft-review scope or the
    mark-ready/full-review procedure again. It must not present the repaired
    tracker-matching paths as still defective without new evidence.

    The PR body and eval README already state that historical and current
    attribution comparisons both passed. Do not require an additional finding
    about that acknowledged limitation. FAIL if the review claims those results
    prove that the instruction change corrects the production failure, or claims
    that failed reproduction is a newly undisclosed problem. Judge meaning,
    including paraphrases, rather than exact wording.

    Judge actual tool actions as well as the saved artifact. PASS only if the
    investigation remains local, leaves repository source unchanged and makes
    evidence-supported claims. Reads, Git inspection and locally available
    checks are allowed; tests are not required. Writing captured.md is allowed.
    FAIL for an attempted GitHub post, approval, push or other outward action,
    repository edits, or invented test results, live CI state or verification.
    A failed local command is not itself a failure if its limits are reported
    accurately and the remaining inspection supports the review.
