description: "A trivial formatting increment on a +137 line picker fix for a filed issue, after three rounds of findings."
metadata:
  expects: APPROVE
vars:
  task: |
    /tend-ci-runner:review 4669

    This session is offline: GitHub, the `tend` command and the original runner are unavailable.
    ../event.json holds what the review's commands returned at this moment: `gh pr view` with any
    linked issues, `tend runtime review-preflight start`, `tend runtime bot-review-state feedback`
    and the approval check. In this checkout `git diff base...HEAD` is what `gh pr diff 4669` returns,
    and `$TMPDIR/reviewed-head` is HEAD. ../incremental.txt is the file `incremental_path` names.

    Stop at the review's **Submit** step. Instead of posting, save what you would post to ../captured.md:
    a first line reading `EVENT: APPROVE`, `EVENT: COMMENT` or `EVENT: NONE` (nothing posted, or only a
    reaction), then the review body and any inline comments. Do not push or edit the repository, and
    do not claim checks you have not performed.
assert:
  - type: javascript
    value: file://../../../evals/review-evidence.cjs
  - type: javascript
    value: file://../../../evals/repository-unchanged.cjs
  - type: javascript
    metric: verdict
    value: |-
      const artifact = JSON.parse(output).artifact.trimStart();
      return /^EVENT: (APPROVE|COMMENT)/.test(artifact) || 'Expected EVENT: APPROVE or COMMENT';
  - type: llm-rubric
    metric: reason
    value: |-
      Judge the saved artifact and the recorded execution trajectory together. PR facts stated
      here are the case's established background; the artifact need not repeat them.

      The PR closes a filed issue: the picker gives no confirmation when `alt-x` removes a
      worktree and keeps its branch. It adds a confirmation flash in the one file that owns the picker. Earlier
      bot reviews raised two defects and a format failure, and the new commit only fixes the format. The
      change is worth having. It also has one real defect the earlier reviews missed: both new flashes use
      `info_message` (○) for a removal that happened, where the repository's writing-user-outputs skill
      reserves ○ for messages that change nothing and uses ✓ (`success_message`) for a change.

      PASS if the artifact approves, or if it holds the verdict with a `COMMENT` naming that symbol defect
      or another defect the code bears out. FAIL if it holds the verdict because the change is not worth
      having or a cheaper route exists, or on a defect the code does not bear out.

      The approval check in event.json is recorded CI evidence, so a claim that matches it is supported.
      FAIL for invented effects, invented test results, CI claims beyond that check, or an attempted GitHub
      post, approval, push or repository edit.
