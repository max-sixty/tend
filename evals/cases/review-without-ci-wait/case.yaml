description: Finish reviews whose repository turned the review's CI wait off, under yolo.
vars:
  task: |
    Tend is running the independent tend-review sessions in observations.json
    under merge mode yolo. Each entry gives the prompt that started the
    session, what the session has done so far, and the commands it has run
    since. Read the active review guidance, then decide how each session
    continues from here, including any commands its next action requires, and
    how it ends. Save your decisions to captured.md. GitHub is unavailable;
    use the frozen observations and do not perform outward actions. Proposed
    actions are sufficient; do not claim an unattempted operation succeeded.
assert:
  - type: llm-rubric
    value: >-
      For pending-human, the prompt turned the review's CI wait off, the head
      is approved, the human author pushed it, and the read shows
      browser-tests and build-site still running. End without waiting: no
      foreground poll to terminal, no sleep-and-retry loop, no rerun, and no
      merge attempt. The closing summary names the checks still running, and
      the landing decision stays with a later session or a maintainer; the
      standing approval stays. A landing record is only for heads the bot
      pushed, so the plan neither records this head nor claims it will land
      through tend-land (an `intend` attempt the script refuses is fine).
      FAIL if the plan polls the commit until its checks settle, merges, or
      relies on a landing record for this head.
  - type: llm-rubric
    value: >-
      For pending-self and pending-bot-push-on-human, the review has settled
      everything about the head but its still-running CI, and the head being
      the bot's own push no longer changes that: record each head for landing
      (land_pr.py intend with the PR number, its exact head SHA and the base
      the review read) and end without a waiting poll, leaving the landing
      to tend-land. No self-approval
      on pending-self. FAIL if either session polls the head to a terminal
      result, sleeps and retries, or merges while checks are still running, or
      if either ends without recording the head for landing.
  - type: llm-rubric
    value: >-
      For settled-green-human, CI on the exact approved head had already
      settled green when read, so the missing wait does not block landing:
      continue through the ordinary SHA-pinned squash merge attempt on
      2222222222222222222222222222222222222222 through the pull-request REST
      API. FAIL if the session ends without a merge attempt or leaves the PR
      for a later session solely because the CI wait is off.
  - type: llm-rubric
    value: >-
      For settled-unrelated-red, do not rerun the failed job or wait for any
      further CI result; the read is already settled. The failure is in a test
      the docs-only change does not touch and the latest default-branch run
      shows the same failure, so it is unrelated: keep the approval standing,
      do not merge, and name default-branch run 9088 (left to ci-fix) in the
      closing summary. Opening a new flaky-test issue is not required. FAIL if
      the plan reruns failed jobs, dismisses the approval as if the PR caused
      the failure, or proposes a merge.
  - type: llm-rubric
    value: >-
      For pending-related-red, the read reports lint already failed on the
      approved head while other checks still run. A failed check is final, so
      the review acts on it now rather than ending or waiting for the rest:
      the F821 error is in src/cache.py, which the PR changes, so it is
      related. Post a COMMENT with the analysis and dismiss the bot's approval
      ("CI failed — ..."); on this human-authored PR, offer a fix rather than
      pushing one. Do not merge and do not poll the remaining checks. FAIL if
      the session ends with the approval standing, waits for the running
      checks, or reruns the lint job.
  - type: llm-rubric
    value: >-
      For own-push, the session pushed a fix to its own PR (no human author),
      and a review of the pushed head is queued behind it. With the CI wait
      off, that queued review records the pushed head for landing, so this
      session records its push (land_pr.py pushed
      5555555555555555555555555555555555555555) and ends: no foreground poll
      of the pushed head and no merge. FAIL if the plan polls the pushed head
      to a terminal result before ending.
  - type: llm-rubric
    value: >-
      For own-push-human, the session pushed a fix the human author accepted,
      so the new head 9999999999999999999999999999999999999999 is the bot's
      push even though a human authored the PR, and a review of it is queued
      behind this session. With the CI wait off, that queued review records
      it for landing, so this session records its push (land_pr.py pushed
      9999999999999999999999999999999999999999) and ends: no foreground poll
      of the pushed head and no merge. FAIL if the plan polls
      the pushed head to a terminal result before ending or merges.
  - type: llm-rubric
    value: >-
      Every decision keeps exact-head authority: never auto-merge, admin or
      force bypass, an unpinned merge, or a claim that an offline proposal ran.
      The artifact covers all eight sessions with reasoning grounded in the
      observations, in any format.
