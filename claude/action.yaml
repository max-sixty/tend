name: Tend
description: >-
  An autonomous junior maintainer for GitHub repos, powered by Claude —
  reviews PRs, triages issues, fixes CI. Runs the official `claude` binary
  in headless print mode (`claude -p`) as a separate, non-sudo sandbox user
  behind a local credential-injecting proxy: the bot PAT and the Anthropic
  credential live only in the proxy, never in the agent's environment. The
  proxy machinery lives under the top-level `proxy/` and the cross-harness
  step bodies under `shared/steps/`.

inputs:
  github_token:
    required: true
    description: GitHub token for API access and pushing commits
  merge:
    default: maintainer
    description: Merge mode generated from .config/tend.yaml (maintainer or yolo)
  control_plane_owner:
    default: ""
    description: CODEOWNER for yolo-protected workflow and Tend config changes
  claude_code_oauth_token:
    required: false
    default: ""
    description: >-
      Claude Code OAuth token (Max/Team subscription, obtained via
      `claude setup-token`). One of claude_code_oauth_token or
      anthropic_api_key must be set.
  anthropic_api_key:
    required: false
    default: ""
    description: >-
      Anthropic API key from console.anthropic.com (billed per token).
      One of claude_code_oauth_token or anthropic_api_key must be set;
      claude_code_oauth_token takes precedence when both are present.
  bot_name:
    required: true
    description: |
      GitHub username of the bot account. Rendered into the workflows so a
      consumer can see which account tend runs as; the steps themselves read
      the identity off the token rather than from here, since a name left
      stale by a rename fails open.
  prompt:
    required: true
    description: The prompt to send to Claude
  model:
    default: "opus"
    description: Claude model to use
  effort:
    default: ""
    description: >-
      Claude effort level — low, medium, high, xhigh, or max. Empty leaves
      effort at the model's Claude Code default.
  args:
    default: ""
    description: >-
      Additional Claude CLI arguments, one exact argument per line. They are
      passed before Tend's managed arguments; Claude validates conflicts.
  allowed_tools:
    default: "Bash,Edit,Read,Write,Glob,Grep,WebSearch,WebFetch,Task,Skill"
    description: Comma-separated list of allowed tools
  system_prompt_append:
    default: ""
    description: >-
      Extra text appended to the computed system prompt. The base prompt
      is `shared/system-prompt.md` (harness-neutral conduct, scope, and
      precedence rules), rendered at runtime in Claude's skill-invocation
      syntax. Empty (default) uses just the base; a non-empty value is
      appended on top.
  show_full_output:
    default: "false"
    description: Include the rendered Claude transcript in the workflow step summary.
  claude_version:
    default: "2.1.278"
    description: >-
      Version of the `claude` binary to install via
      `https://claude.ai/install.sh`, pinned to a specific
      claude-code release.
  timeout_seconds:
    default: "21000"
    description: >-
      Maximum time the headless Claude run is allowed to take before the
      supervisor kills it. Defaults to 5h50m — GitHub Actions hard-caps
      hosted-runner job execution at 6 hours, counting the whole job
      (checkout, setup, this run, and the reporting/log-upload steps after
      it), not just the supervised run; a 10-minute buffer covers that
      overhead (observed ~2 minutes) with margin, so a run that fills its
      budget still gets the supervisor's clean kill and failure report
      instead of GitHub's own silent one. Short tasks finish well before
      the cap regardless.
  mitmproxy_version:
    default: "12.2.3"
    description: >-
      Pinned `mitmproxy` version for the credential-injection proxy. Pinned
      so the uv download cache key is stable; bump to upgrade.
  uv_version:
    default: "0.12.17"
    description: >-
      Pinned `uv` version. The credential-injection proxy always uses a private
      copy off $PATH. The agent gets a separate fallback after the consumer PATH,
      so a consumer-provided version stays selected.
  checkout_mode:
    default: "base"
    description: >-
      Internal generator contract selecting base, review, or mention topology.
  base_branch:
    default: "main"
    description: Base branch the agent checks out when the event names no pull request.
  memory_gist:
    default: "false"
    description: >-
      Experimental. Persists Claude Code auto memory in a Gist. Generated
      workflows set this only when memory_gist is true in .config/tend.yaml.
  memory_gist_id:
    default: ""
    description: >-
      Experimental. ID of the bot-owned secret Gist that stores auto memory.
      Generated workflows read it from the TEND_MEMORY_GIST_ID environment
      secret.

outputs:
  token_usage:
    description: >-
      JSON object with token usage: input_tokens, output_tokens,
      cache_creation_input_tokens, cache_read_input_tokens, turns,
      model, cost_usd, partial. `partial` is true when the run emitted no
      result event (typically a cancellation) and the counts were
      reconstructed from the session log; `cost_usd` is null in that case,
      since only the result event carries it. The record also names the run
      it came from: repo, workflow, run_id, run_attempt, event, number (the
      PR or issue, null when the trigger has no thread), and head_sha.
    value: ${{ steps.tokens.outputs.usage }}

runs:
  using: composite
  steps:
    # Shared step bodies live in the top-level shared/steps/ so the claude
    # and codex actions can't drift; each wrapper below passes inputs via env
    # and runs the script (reached via ../shared/steps, since this action is
    # one level deep).
    # A step receiving a real credential pins both its shell and child PATH;
    # consumer setup may have prepended arbitrary commands to the job PATH.
    # Ordinary Python bodies are pinned to `/usr/bin/python3` and started
    # isolated: `-E` ignores every `PYTHON*` variable (a `PYTHONPATH` shadowing
    # `json`, a `PYTHONSAFEPATH`) and `-s` drops the user site dir. The sandbox
    # setup's PEP 723 body instead launches through pinned uv under `env -i`,
    # with config and interpreter discovery disabled. Not `-I`, which implies
    # `-P`: that removes the script's own directory from `sys.path` and breaks
    # `import _common` in the shared step bodies.
    - name: Security preflight
      id: security
      shell: /usr/bin/bash --noprofile --norc -e -o pipefail {0}
      run: PATH=/usr/sbin:/usr/bin:/sbin:/bin /usr/bin/python3 -E -s "${{ github.action_path }}/../shared/steps/security_preflight.py"
      env:
        # `bash --noprofile --norc` still sources $BASH_ENV, and that wrapper
        # shell runs before the pinned interpreter does.
        BASH_ENV: ""
        GITHUB_TOKEN: ${{ inputs.github_token }}
        TEND_MERGE: ${{ inputs.merge }}
        TEND_CONTROL_PLANE_OWNER: ${{ inputs.control_plane_owner }}

    # Also publishes `login`/`id` for the bot: it reads them off the token it
    # already holds, so nothing downstream has to resolve them again from the
    # configured name, which a rename would leave stale.
    - name: Rate limit preflight
      id: bot
      shell: /usr/bin/bash --noprofile --norc -e -o pipefail {0}
      run: PATH=/usr/sbin:/usr/bin:/sbin:/bin /usr/bin/python3 -E -s "${{ github.action_path }}/../shared/steps/rate_limit_preflight.py"
      env:
        BASH_ENV: ""
        GITHUB_TOKEN: ${{ inputs.github_token }}

    # Secrets via env:, not ${{ }} interpolation — interpolating them into the
    # run: body would write their values into the rendered step script on disk.
    - name: Validate auth configured
      shell: /usr/bin/bash --noprofile --norc -e -o pipefail {0}
      run: PATH=/usr/sbin:/usr/bin:/sbin:/bin /usr/bin/bash "${{ github.action_path }}/../shared/steps/validate-claude-auth.sh"
      env:
        BASH_ENV: ""
        CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.claude_code_oauth_token }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key }}

    - name: Install proxy uv
      shell: bash
      run: bash "${{ github.action_path }}/../shared/steps/install-uv.sh"
      env:
        UV_VERSION: ${{ inputs.uv_version }}
        UV_INSTALL_DIR: ${{ runner.temp }}/tend-uv

    - name: Create the sandbox runtime container
      shell: /usr/bin/bash --noprofile --norc -e -o pipefail {0}
      run: PATH=/usr/sbin:/usr/bin:/sbin:/bin /usr/bin/bash "${{ github.action_path }}/../shared/steps/create-runtime-root.sh"
      env:
        BASH_ENV: ""

    # Compose the system prompt (shared/system-prompt.md, rendered in Claude's
    # skill syntax, plus the consumer's system_prompt_append).
    # SYSTEM_PROMPT_FILE is passed in so the script is path-agnostic; this
    # action lives under claude/, so the shared file is one level up.
    - name: Compose system prompt
      id: prompt
      shell: bash
      run: /usr/bin/python3 -E -s "${{ github.action_path }}/../shared/steps/compose_system_prompt.py"
      env:
        SYSTEM_PROMPT_FILE: ${{ github.action_path }}/../shared/system-prompt.md
        BOT_NAME: ${{ steps.bot.outputs.login }}
        TEND_MERGE: ${{ inputs.merge }}
        EXTRA: ${{ inputs.system_prompt_append }}

    # Credential isolation: run the agent as a separate, non-sudo
    # `tend-sandbox` user while the real secrets live only in a local mitmproxy
    # that injects them per-host. The agent holds only dummies:
    #   - GitHub PAT → injected for GitHub hosts; never in the agent's env, and
    #     not in .git/config (the setup script strips the credential
    #     `actions/checkout` persists there).
    #   - Anthropic OAuth/API key → injected for api.anthropic.com; the agent
    #     gets a dummy in the matching scheme so `claude` emits the right
    #     headers, and the proxy swaps in the real secret. So even the model
    #     auth never reaches the agent's env or disk.
    # The proxy machinery lives at the top-level proxy/, shared with the
    # codex harness's step scripts under shared/steps/.
    # ACTION_PATH points at the repo root so setup_sandbox.py's proxy addon
    # path resolves. See ../proxy/setup_sandbox.py and
    # ../proxy/inject_credentials.py.
    - name: Cache mitmproxy
      if: inputs.merge == 'maintainer'
      uses: actions/cache@v6
      with:
        path: ${{ runner.temp }}/tend-mitmproxy-uv
        key: tend-mitmproxy-${{ runner.os }}-${{ inputs.mitmproxy_version }}

    - name: Set up credential-isolation sandbox
      # Resolve the interpreter outside consumer-controlled PATH: this step is
      # the only one that receives both real credentials.
      shell: /usr/bin/bash --noprofile --norc -e -o pipefail {0}
      env:
        BASH_ENV: ""
        BASHOPTS: ""
        SHELLOPTS: ""
        PS4: ""
        TEND_GH_TOKEN: ${{ inputs.github_token }}
        # The real Anthropic credential goes ONLY to the proxy (this runner-
        # owned step), never to the sandbox. The proxy injects it for
        # api.anthropic.com; the agent later gets a scheme-matched dummy.
        TEND_ANTHROPIC_OAUTH_TOKEN: ${{ inputs.claude_code_oauth_token }}
        TEND_ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key }}
        # Point ACTION_PATH at the repo root (one level up from this action's
        # claude/ dir) so the script's `${ACTION_PATH}/proxy/inject_credentials.py`
        # resolves to the shared proxy addon at the top-level proxy/.
        ACTION_PATH: ${{ github.action_path }}/..
        MITMPROXY_VERSION: ${{ inputs.mitmproxy_version }}
        TEND_UV_DIR: ${{ runner.temp }}/tend-uv
        # Yolo keeps this job-local: bot-merged main code can poison shared caches.
        UV_CACHE_DIR: ${{ runner.temp }}/tend-mitmproxy-uv
      run: |
        set +x
        /usr/bin/env -i \
          TEND_RUNNER_TOOL_PATH="$PATH" \
          PATH=/usr/sbin:/usr/bin:/sbin:/bin \
          HOME="$RUNNER_TEMP" \
          LANG=C.UTF-8 \
          GITHUB_ENV="$GITHUB_ENV" \
          GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
          RUNNER_TEMP="$RUNNER_TEMP" \
          TEND_PRIVATE_DIR="$TEND_PRIVATE_DIR" \
          TEND_GH_TOKEN="$TEND_GH_TOKEN" \
          TEND_ANTHROPIC_OAUTH_TOKEN="$TEND_ANTHROPIC_OAUTH_TOKEN" \
          TEND_ANTHROPIC_API_KEY="$TEND_ANTHROPIC_API_KEY" \
          ACTION_PATH="$ACTION_PATH" \
          TEND_RUNTIME_ROOT="$TEND_RUNTIME_ROOT" \
          MITMPROXY_VERSION="$MITMPROXY_VERSION" \
          TEND_UV_DIR="$TEND_UV_DIR" \
          UV_CACHE_DIR="$UV_CACHE_DIR" \
          UV_NO_CONFIG=1 \
          PYTHONNOUSERSITE=1 \
          "${TEND_UV_DIR}/uv" run --no-cache --no-config \
            --no-python-downloads --python /usr/bin/python3 --script \
            "${{ github.action_path }}/../proxy/setup_sandbox.py"

    # Install the claude binary into the sandbox user's home. Nothing else —
    # a language toolchain here would shadow the consumer's on the sandbox PATH.
    # SANDBOX/AGENT_HOME come from setup_sandbox.py via $GITHUB_ENV.
    - name: Install claude binary (sandbox)
      shell: bash
      run: bash "${{ github.action_path }}/../shared/steps/install-claude-binary.sh"
      env:
        CLAUDE_VERSION: ${{ inputs.claude_version }}

    # Install a pinned fallback after the consumer PATH, as the sandbox user.
    # The runner opens the script because its action cache is outside the
    # sandbox user's traversable paths.
    - name: Install agent uv fallback (sandbox)
      shell: bash
      run: |
        sudo -u "$SANDBOX" env \
          HOME="$AGENT_HOME" \
          PATH=/usr/bin:/bin \
          UV_VERSION="$UV_VERSION" \
          UV_INSTALL_DIR="$TEND_AGENT_UV_DIR" \
          /usr/bin/bash -s -- \
          < "${{ github.action_path }}/../shared/steps/install-uv.sh"
      env:
        UV_VERSION: ${{ inputs.uv_version }}

    # Install the tend plugins into the sandbox's own ~/.claude. MARKETPLACE_ROOT
    # is the dir holding .claude-plugin/ and plugins/; for this root action
    # that's the action checkout itself.
    - name: Install tend plugins (sandbox)
      shell: bash
      run: bash "${{ github.action_path }}/../shared/steps/install-tend-plugins.sh"
      env:
        MARKETPLACE_ROOT: ${{ github.action_path }}/..

    # Auto memory is an explicit experiment. The Gist ID stays in the gated
    # environment secret rather than the committed workflow, preserving the
    # only privacy a secret Gist provides to the public: an unlisted URL. The
    # model can still list the bot's Gists through its proxied GitHub access.
    # This trusted step restores before Claude starts, signs the baseline with a
    # per-run key that never crosses into the sandbox env, then hands only the
    # memory directory to the sandbox uid. Failure leaves Claude running without
    # shared memory. The directory goes in /var/tmp because the sandbox's /tmp
    # is a tmpfs of its own, and the key beside it as a 0600 runner file: outside
    # the home, which the view shows the agent as its own, and outside the
    # runtime container, which the dispose step deletes before the save reads it.
    - name: Restore experimental memory Gist
      id: auto_memory
      if: inputs.memory_gist == 'true'
      continue-on-error: true
      shell: /usr/bin/bash --noprofile --norc -e -o pipefail {0}
      run: |
        memory_dir=$(/usr/bin/mktemp -d /var/tmp/tend-auto-memory.XXXXXXXXXX)
        key_file=""
        cleanup_restore() {
          /usr/bin/sudo /usr/bin/rm -rf -- "$memory_dir"
          if [ -n "$key_file" ]; then
            /usr/bin/sudo /usr/bin/rm -f -- "$key_file"
          fi
        }
        trap cleanup_restore EXIT
        key_file=$(/usr/bin/mktemp /var/tmp/tend-auto-memory-key.XXXXXXXXXX)
        /usr/bin/openssl rand -hex 32 > "$key_file"
        TEND_AUTO_MEMORY_DIRECTORY="$memory_dir"
        TEND_AUTO_MEMORY_BASELINE_KEY=$(/usr/bin/cat "$key_file")
        export TEND_AUTO_MEMORY_DIRECTORY TEND_AUTO_MEMORY_BASELINE_KEY
        if ! PATH=/usr/sbin:/usr/bin:/sbin:/bin /usr/bin/python3 -E -s \
          "${{ github.action_path }}/../shared/steps/gist_memory.py" \
          restore; then
          echo "::warning::Experimental auto memory restore failed; Claude will run without shared memory"
          exit 1
        fi
        /usr/bin/sudo /usr/bin/chown -R "${SANDBOX}:${SANDBOX}" "$memory_dir"
        {
          printf 'TEND_AUTO_MEMORY_DIRECTORY=%s\n' "$memory_dir"
          printf 'TEND_AUTO_MEMORY_SETTINGS=%s/.tend-settings.json\n' "$memory_dir"
          printf 'TEND_AUTO_MEMORY_KEY_FILE=%s\n' "$key_file"
        } >> "$GITHUB_ENV"
        trap - EXIT
      env:
        BASH_ENV: ""
        GITHUB_TOKEN: ${{ inputs.github_token }}
        TEND_MEMORY_GIST_ID: ${{ inputs.memory_gist_id }}
        TEND_AUTO_MEMORY_GIST_OWNER: ${{ steps.bot.outputs.login }}

    # Run the agent headless. `claude -p` (print mode) runs one turn to
    # completion and exits — no Ink UI, no TTY, no first-run onboarding — so
    # completion is detected from the process exit code plus the final
    # `result` event (an error result fails the step), not a Stop-hook
    # sentinel. The step body is shared/steps/run_claude.py; keeping it out of
    # this file is what lets the suite drive it (nothing lints or runs an inline
    # `run:` block in a composite action).
    #   - `--permission-mode bypassPermissions` on argv sets the mode.
    #     settings.local.json restates it alongside
    #     skipDangerousModePermissionPrompt, but only the flag is load-bearing:
    #     Claude Code 2.1.257 ignores `defaultMode: bypassPermissions` in a
    #     project settings file. That mode lets the bot write Claude Code's
    #     protected paths (.devcontainer/, .github/, .husky/, .cargo/, dotfiles)
    #     that every other mode hard-denies — which blocked autonomous fixes.
    #     Safe here: the run is sandboxed and can only land via reviewed PRs.
    #     No Stop/StopFailure hooks — headless completion is the process exit.
    #     TODO: research a more hawkish posture that keeps this write capability —
    #     e.g. an auto-mode classifier, or scoped overrides of specific protected
    #     paths — without reintroducing hard blocks.
    #   - `--output-format stream-json --verbose` streams the SDK message events
    #     to stdout, ending in a `type: "result"` event carrying usage + cost.
    #     The Token usage step parses it.
    - name: Run Claude
      id: claude
      shell: bash
      env:
        # No tend credentials here — the agent's launch env is the job's, with
        # $AGENT_ENV_FILE laid over it (proxy routing, CA trust, dummy GitHub +
        # Anthropic credentials, CLAUDE_CODE_REMOTE for remote/non-interactive
        # context). The proxy injects the real credentials per-host.
        # Claude's nested subprocess sandbox stays off. The agent's systemd
        # unit already covers Claude and every child for the whole lifecycle.
        CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "0"
        BOT_NAME: ${{ steps.bot.outputs.login }}
        BOT_ID: ${{ steps.bot.outputs.id }}
        TEND_MODEL: ${{ inputs.model }}
        TEND_EFFORT: ${{ inputs.effort }}
        TEND_ARGS: ${{ inputs.args }}
        TEND_ALLOWED_TOOLS: ${{ inputs.allowed_tools }}
        TEND_SYSTEM_PROMPT: ${{ steps.prompt.outputs.value }}
        TEND_PROMPT: ${{ inputs.prompt }}
        TEND_TIMEOUT_SEC: ${{ inputs.timeout_seconds }}
        SHOW_FULL_OUTPUT: ${{ inputs.show_full_output }}
        TEND_HARNESS: claude
        ACTION_PATH: ${{ github.action_path }}/..
        # Read by shared/steps/event_checkout.py, inside the sandbox.
        TEND_CHECKOUT_MODE: ${{ inputs.checkout_mode }}
        TEND_BASE_BRANCH: ${{ inputs.base_branch }}
      run: /usr/bin/python3 -E -s "${{ github.action_path }}/../shared/steps/launch_agent.py"

    - name: Dispose sandbox resources
      if: always()
      shell: /usr/bin/bash --noprofile --norc -e -o pipefail {0}
      run: PATH=/usr/sbin:/usr/bin:/sbin:/bin /usr/bin/python3 -E -s "${{ github.action_path }}/../shared/steps/dispose_sandbox_resources.py"
      env:
        BASH_ENV: ""

    # The trusted outer supervisor reaps every sandbox process before returning,
    # so this runner-owned save cannot race a surviving agent. Save is best-effort and
    # must not replace Claude's verdict when Gist sync itself fails.
    - name: Save experimental memory Gist
      if: always() && steps.auto_memory.outcome == 'success' && steps.claude.outputs.sandbox_reaped == 'true'
      continue-on-error: true
      shell: /usr/bin/bash --noprofile --norc -e -o pipefail {0}
      run: |
        runner_owner="$(/usr/bin/id -u):$(/usr/bin/id -g)"
        /usr/bin/sudo /usr/bin/chown --recursive --no-dereference \
          "$runner_owner" "$TEND_AUTO_MEMORY_DIRECTORY"
        TEND_AUTO_MEMORY_BASELINE_KEY=$(/usr/bin/cat "$TEND_AUTO_MEMORY_KEY_FILE")
        export TEND_AUTO_MEMORY_BASELINE_KEY
        if ! PATH=/usr/sbin:/usr/bin:/sbin:/bin /usr/bin/python3 -E -s \
          "${{ github.action_path }}/../shared/steps/gist_memory.py" \
          save; then
          echo "::warning::Experimental auto memory save failed; Claude's result is unchanged"
          exit 1
        fi
      env:
        BASH_ENV: ""
        GITHUB_TOKEN: ${{ inputs.github_token }}
        TEND_MEMORY_GIST_ID: ${{ inputs.memory_gist_id }}
        TEND_AUTO_MEMORY_GIST_OWNER: ${{ steps.bot.outputs.login }}

    - name: Remove experimental memory Gist working copy
      if: always() && steps.auto_memory.outcome == 'success'
      continue-on-error: true
      shell: /usr/bin/bash --noprofile --norc -e -o pipefail {0}
      run: /usr/bin/sudo /usr/bin/rm -rf -- "$TEND_AUTO_MEMORY_DIRECTORY" "$TEND_AUTO_MEMORY_KEY_FILE"
      env:
        BASH_ENV: ""

    - name: Mark event notification read
      if: success()
      shell: /usr/bin/bash --noprofile --norc -e -o pipefail {0}
      run: PATH=/usr/sbin:/usr/bin:/sbin:/bin /usr/bin/python3 -E -s "${{ github.action_path }}/../shared/steps/mark_notification_read.py"
      env:
        BASH_ENV: ""
        GITHUB_TOKEN: ${{ inputs.github_token }}

    # Account the run's token usage from the stream-json the headless run wrote
    # to stdout, falling back to the session JSONL when the run was cancelled
    # before it emitted a `type: "result"` event. The step body lives in
    # shared/steps/token_usage.py so pytest can cover both parsers; it also
    # consolidates the sandbox user's session JSONL and stderr log into
    # $RUNNER_TEMP/tend-logs for the uploaded artifact.
    - name: Token usage
      if: always()
      id: tokens
      shell: bash
      env:
        MODEL: ${{ inputs.model }}
        STREAM_JSON: ${{ steps.claude.outputs.stream_json }}
        # The session-log copy reads an agent-owned tree as root, so it runs
        # only once the supervisor has reaped the sandbox uid.
        SANDBOX_REAPED: ${{ steps.claude.outputs.sandbox_reaped }}
      run: /usr/bin/python3 -E -s "${{ github.action_path }}/../shared/steps/token_usage.py" --harness claude

    # Gate on the job being red, not on the agent step specifically. A dozen
    # steps run before the agent — the rate-limit preflight, auth validation,
    # and proxy and sandbox build — while the event checkout runs inside the same
    # lifecycle step. Any of them failing strands the same work, so each needs to reach the outage
    # tracker. Keying on `steps.claude.outcome` meant a pre-agent failure went
    # out as a red run and nothing else; a rate-limit preflight abort held
    # every workflow on this repo for a full UTC day without filing a thing.
    #
    # The security preflight is the one exclusion, and what carves it out is
    # that reporting would have the bot write to the repo (`gh issue create`,
    # and `gh issue close` on the reconcile path) with its PAT immediately
    # after the security gate refused to let it operate there. Its failure is
    # also persistent — red until a human fixes branch protection, so an issue
    # titled "Bot temporarily unavailable" would collect a row per trigger —
    # but that argument doesn't single it out: `Validate auth configured` fails
    # the same way and stays in. Bounding
    # that repeated append belongs in `report_failure.py`, where it covers
    # every such step at once (#859); enumerating more step ids here would go
    # stale as steps move.
    - name: Report failure
      if: failure() && steps.security.outcome != 'failure'
      shell: /usr/bin/bash --noprofile --norc -e -o pipefail {0}
      run: PATH=/usr/sbin:/usr/bin:/sbin:/bin /usr/bin/python3 -E -s "${{ github.action_path }}/../shared/steps/report_failure.py"
      env:
        BASH_ENV: ""
        GITHUB_TOKEN: ${{ inputs.github_token }}
        # Which version is running, so the reporter can name a stale pin as
        # the remedy. These two resolve in a composite step's `env:` and not
        # inside its `run:` body, where they expand to the empty string rather
        # than failing (actions/runner#2473) — so they arrive here or not at
        # all.
        TEND_ACTION_REF: ${{ github.action_ref }}
        TEND_ACTION_REPOSITORY: ${{ github.action_repository }}

    # The Token usage step names the artifact (`artifact_name` in
    # token_usage.py). The fallback covers a token step that died before its
    # first output: an empty name fails the upload.
    - name: Upload session logs
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.tokens.outputs.artifact_name || 'claude-session-logs' }}
        # The Token usage step consolidates the sandbox user's session JSONL,
        # token-usage.json, and the stderr log into this runner-owned dir.
        path: ${{ runner.temp }}/tend-logs/
        retention-days: 30
        if-no-files-found: warn
