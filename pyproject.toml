# Workspace root — nothing is published from here (no build-system, so uv never
# builds it; the package is the `generator/` member), though its `proxy` group
# and uv.lock ship: the harness actions install the proxy from them. It exists so
# every Python suite in the repo shares one environment, which makes plain
# `uv run pytest` from the repo root the whole Python test run: pytest needs no
# config of its own, since collecting from the root reaches generator/, proxy/,
# shared/steps/, and the install-tend scripts, and its default `norecursedirs`
# already skips node_modules and dot-dirs. proxy/, shared/steps/ and the
# install-tend scripts dir aren't packages, so pytest's prepend import mode
# names their test modules by basename alone — keep those basenames distinct or
# collection aborts, and never `from conftest import …` (two dirs have one;
# shared/steps/_fakes.py is the importable home for its doubles).
#
# The floor is 3.12 because mitmproxy needs it; the published package still
# supports 3.11 (see generator/pyproject.toml), which nothing here can lower.
[project]
name = "tend-dev"
version = "0"
requires-python = ">=3.12"

[tool.uv.workspace]
members = ["generator"]

[tool.uv.sources]
tend = { workspace = true }

[dependency-groups]
# The credential proxy's runtime. Consumer jobs install exactly this group's
# closure from uv.lock (`--frozen --only-group proxy` in
# proxy/setup_sandbox.py), hashes and all, so uv.lock is what the process
# holding the real PAT and model credential runs — not only what tests see.
proxy = ["mitmproxy==12.2.3"]
dev = [
  "tend",
  "pytest>=9.0.2",
  "pytest-regtest>=2.1.1",
  # The proxy addon imports mitmproxy.test, so its tests run against the same
  # locked closure the proxy runs in consumer jobs.
  { include-group = "proxy" },
  # test_repo_pins.py reads YAML. `tend` happens to pull ruamel in, but declare
  # what the tests import.
  "ruamel.yaml>=0.18",
  # test_repo_pins.py reads a version specifier out of a pyproject and asks
  # whether a version satisfies it. Only ever arrives transitively otherwise.
  "packaging>=25",
]

# `certifi` is the PyPI package name, which typos 1.49 started reading as a
# misspelling of "certify".
[tool.typos.default.extend-words]
certifi = "certifi"
